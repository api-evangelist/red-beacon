name: Red Beacon
description: >-
  Redbeacon was a consumer home-services marketplace that connected homeowners
  with local service professionals — for home repair, cleaning, landscaping,
  handyman and similar jobs — letting people describe a job and receive quotes
  from vetted local pros. The company was an early venture-backed startup (with
  Mayfield among its investors) and was acquired by The Home Depot in 2012. The
  standalone Redbeacon consumer service was subsequently wound down. As of this
  enrichment pass the redbeacon.com domain still resolves (Cloudflare DNS,
  Google Workspace email) but serves no live website (origin returns HTTP 525 /
  400) and publishes no developer portal, API documentation, or machine-readable
  API surface. This profile is retained as a historical/portfolio-graph node.
